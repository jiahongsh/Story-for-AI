name: one-shot-999plus1-normalize

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-999plus1.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Normalize 999+1 semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('他们不是人')

          def replace_exact(path, old, new):
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{p}: expected exact block once, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('updated', p)

          def replace_regex(path, pattern, repl):
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              new_text, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{p}: expected regex block once, got {count}')
              p.write_text(new_text, encoding='utf-8')
              print('updated', p)

          # 0) 新增单一的终局语义定义，解决“保留999+1但不把它写成算术胜负”的问题。
          authority = ROOT / '设定/世界观/999+1终局机制.md'
          authority.write_text('''# 999+1终局机制 · 作者后台权威定义

> **职责**：本文件只定义终局“999+1”的语义。它是人物关系结构与主题符号，不是战斗数值公式。
>
> **数值归属**：MEM上限、壳王归并规模等具体数字仍以 `数值定稿.md` 为唯一数值权威；本文件负责解释“999+1到底意味着什么”。
>
> **冲突处理**：其他文件若把“999+1”解释为 `MEM 999→1000`、`EX 0→1`、攻击/战力增加、或用 `1000>999` 直接判定壳王失败，均以本文件为准并立即修正。

---

## 一、999是什么

镜辞的MEM上限仍为999。

999表示：

> **一个主体能够主动完成的“有效铭记、关系再暴露与现实承接”的后台极限。**

它不是：
- 镜辞体内装着999个人；
- 999点攻击力；
- 999条存在锚点归镜辞所有；
- 收集满999个名字后自动解锁胜利。

人物意义上，999反而是镜辞“我可以独自把所有人都记住”这条中心化道路能够抵达的极限。

---

## 二、+1是什么

终局“+1”**正式锁定由姜霁承担**。

但这个“1”不是第1000点MEM，也不是额外EX、战斗力、技能等级或系统奖励。

它表示：

> **第一份不由镜辞主动保存，而是从另一个生命反向、准确地指向镜辞本人的深层关系证据。**

关系方向必须明确：

```text
999：镜辞 → 其他人
+1：姜霁 → 镜辞
```

因此“+1”进入的不是MEM轴，而是**关系方向**。

姜霁之所以承担这一位置，不是因为“女主自动获得终局资格”，而是因为前文必须持续证明：
- 她长期认识镜辞的行为基线；
- 她被镜辞真实改变过；
- 镜辞也允许她反过来改变自己的选择；
- 当姓名、档案和显性记忆都失去稳定指向时，她仍能通过这些真实关系后果判断“镜辞会怎么做”。

---

## 三、999+1不是1000>999

作者后台允许继续使用“999+1”这个符号，因为它具有明确的终局意象。

但它的正确含义是：

> **单向铭记抵达极限之后，出现了反向关系，单向结构第一次闭合成双向网络。**

所以禁止把终局写成：

```text
999 + 1 = 1000
1000 > 999
因此镜辞击败壳王
```

这会把关系主题降格成数值破上限。

正确写法是：

```text
999：我曾真正记住、理解并帮助这些关系重新被现实看见
+1：在世界无法稳定指向我时，仍有另一个生命能通过真实关系反向找到我
```

“999+1”是**双向关系成立的符号**，不是大小比较公式。

---

## 四、世界层胜负与镜辞个人闭环必须分开

### 世界层终局

临江市摆脱“唯一指向”，依赖多方分别切断：
- 白塔认证链；
- 关系归并链；
- 现实身份同步链；
- 群体记忆/裂缝同步链。

第五式负责重新暴露仍有现实承接点的关系因果，但不能独自恢复城市。

因此世界层胜利是**分布式协作结果**，不是姜霁的“+1”替全城加点。

### 镜辞个人终局

“999+1”只回答：

> **当镜辞自己成为那个几乎无法被世界稳定指向的人时，他是否仍然只是一个负责保存别人的孤立中心？**

答案是否定的。

姜霁的反向寻找证明：镜辞自己也已经真实进入别人的生命，并被别人的选择继续指向。

---

## 五、壳王与镜辞的镜像

壳王的方向是：

```text
999 → 1
```

它试图把大量冲突人生、记忆和关系压成唯一答案。

镜辞早期的危险方向是：

```text
1 → 999
```

他想由自己成为保存所有人的中心。

镜辞终局真正学会的是：

```text
999 ↔ +1
```

不是“我比你多一点”。

而是：

> **我终于承认自己也只是关系网络中的一个节点；我会改变别人，也会被别人改变。**

---

## 六、正文表达红线

正文可以出现“999+1”作为极少量意象或作者后台结构，但不得出现系统式胜负结算。

禁止：
- `MEM 999→1000`；
- `EX 0→1`；
- `1000>999，所以壳王失败`；
- “姜霁提供最后1点能量”；
- “女主之爱突破系统上限”。

优先表现具体行动：

> 系统已经显示无人滞留，姜霁却因为真正了解镜辞留下来的选择习惯，判断他仍在最后一个没有撤离的人身边，于是逆向回去找他。

这件事先成立。

“999+1”只是作者对这份**双向关系闭环**的后台命名。

---

## 七、最高权威解释

> **999不是力量的极限，而是一个人试图独自保存世界时能够抵达的极限。**
>
> **+1不是超过极限的数值，而是来自另一个生命的反向指向。**
>
> **镜辞最终明白，存在从来不是“我记得你”，而是“我们曾经彼此改变”。**
''', encoding='utf-8')
          print('created', authority)

          # 1) 姜霁：从候选改为正式锁定，但去掉“女主=自动结算资格”。
          replace_exact(
              '设定/角色/姜霁.md',
              '''终局那一个指向镜辞的活人锚点**可以由她承担，也可以不是她**；不能因为她是女主就自动获得“最终+1资格”。\n\n如果最终由姜霁承担，必须建立在此前长期细节上：''',
              '''终局“999+1”中的**+1正式锁定由姜霁承担**。但这不是因为她是女主，也不是系统授予的结算资格；“+1”只代表一份从另一个生命反向准确指向镜辞的真实关系证据，**不属于MEM、不增加EX、不增加战斗参数**。\n\n这份资格必须建立在此前长期细节上：'''
          )
          replace_exact(
              '设定/角色/姜霁.md',
              '8. 终局“+1”不能由女主身份自动获得，必须由前七卷双向关系事实支撑。',
              '8. 终局“+1”正式锁定为姜霁，但必须由前七卷双向关系事实支撑；不得写成女主身份自动获得、MEM+1、EX回升或战力加成。'
          )

          # 2) 关系文件：保留锁定，明确+1是方向而不是数值。
          replace_exact(
              '设定/关系.md',
              '''姜霁是终局“999+1”中的**最终+1**，这一点已经锁定，不再保留候选制。\n\n但“+1属于姜霁”不等于“因为她是女主，所以自动获得结算资格”。第8卷仍必须用具体行动兑现这份关系：当系统、姓名与显性记忆都已经无法稳定指出镜辞仍在源裂缝内部时，姜霁必须依靠多年共同生活形成的行为基线和彼此造成的真实改变，判断镜辞一定还在检查最后一个没有撤出来的人，并因此反向回去寻找他。\n\n所以终局成立的逻辑固定为：\n\n> **姜霁不是靠身份标签记住镜辞，而是在标签失效以后，仍然知道“镜辞会怎样选择”。**\n\n这份准确指向必须由前七卷持续积累，不能临近终局才补几场浪漫戏硬凑。''',
              '''姜霁是终局“999+1”中的**最终+1**，这一点正式锁定，不再保留候选制。\n\n但“+1”不是第1000点MEM，也不是EX、战斗力或系统奖励。它代表的是一条**反向关系指向**：999描述镜辞主动铭记、理解并帮助他人关系重新进入现实的极限；+1描述在镜辞自己的常规身份指向崩解后，仍有另一个生命能够准确指向镜辞本人。\n\n第8卷必须用具体行动兑现这份关系：当系统、姓名与显性记忆都已经无法稳定指出镜辞仍在源裂缝内部时，姜霁依靠多年共同生活形成的行为基线和彼此造成的真实改变，判断镜辞一定还在检查最后一个没有撤出来的人，并因此反向回去寻找他。\n\n所以终局成立的逻辑固定为：\n\n> **姜霁不是靠身份标签记住镜辞，而是在标签失效以后，仍然知道“镜辞会怎样选择”。**\n\n这份准确指向必须由前七卷持续积累，不能临近终局才补几场浪漫戏硬凑。它只完成镜辞个人的双向关系闭环；城市摆脱“唯一指向”仍依赖四条链被不同人和组织分别切断。'''
          )

          # 3) 数值定稿：保留MEM=999，但把“1000>999”从胜负公式改为关系结构符号。
          replace_exact(
              '设定/世界观/数值定稿.md',
              '| 铭记层 | 终局反归并 | `有效关系再暴露/独立承接规模 > 目标强制归并规模` | 不是普通伤害，也不是恢复人数统计，不在正文显示算式 |',
              '| 铭记层 | 终局反归并 | 有效关系再暴露、多源独立承接与四链断开共同破坏“唯一指向”闭环 | 不是普通伤害，也不是恢复人数统计，不使用大小比较直接判胜 |'
          )
          replace_regex(
              '设定/世界观/数值定稿.md',
              r'### 6\.1 终局999→1000（作者后台锁定）\n.*?\n---\n\n## 七、卷 ↔ 主角 ↔ 对手平衡表',
              '''### 6.1 终局999+1（作者后台锁定）\n\n- 壳王终局篡改/归并规模：**999**；\n- 镜辞自身可完成的有效MEM上限：**999**；\n- 这两个“999”保留为作者后台的镜像尺度，但**不再使用 `1000>999` 作为终局胜负判定**；\n- 镜辞的999表示一个主体能够主动完成的有效铭记、关系再暴露与现实承接的极限，不表示把999个人的存在装进自己；\n- 最终“+1”正式锁定由**姜霁**承担，但它**不计入MEM、不改变MEM上限、不增加EX、不增加战斗参数**；\n- “+1”表示一份从另一个生命反向准确指向镜辞本人的深层关系证据：在常规姓名/身份指向几乎全部崩解时，姜霁仍能通过长期共同生活形成的行为基线与彼此真实造成的改变，判断镜辞会怎样选择，并据此找到他；\n- 作者后台继续使用“999+1”作为**双向关系闭环的符号**：999是“镜辞→他人”的主动铭记极限，+1是“姜霁→镜辞”的反向指向；\n- 城市级胜利不由这一个“+1”完成。白塔认证、关系归并、现实身份同步、群体记忆/裂缝同步四条链仍必须被多方分别切断，第五式只负责让仍有现实承接点的关系因果重新获得被看见和复核的机会。\n\n**正文红线**：不得出现“MEM 999→1000”“EX 0→1”“系统判定1000>999”“姜霁提供最后1点能量”等提示。必须先写姜霁的具体关系行动；“999+1”只作为作者后台对双向关系结构的命名。\n\n---\n\n## 七、卷 ↔ 主角 ↔ 对手平衡表'''
          )

          # 4) 力量体系：只保留原则解释，数值细节回指数值定稿与新权威文件。
          replace_exact(
