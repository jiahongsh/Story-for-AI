              '**999+1**只存在于作者后台，并按 `999+1终局机制.md` 解释：999代表镜辞主动铭记/承接的单向极限，+1正式由姜霁承担，代表另一个生命对镜辞的反向真实指向。它不是MEM+1、EX复活、战力增加，也不使用“1000>999”直接判定终局胜负；城市级胜利仍依赖四条链被分别切断。'
          )

          # 5) 金手指：重写终局闭环，不再用算术大小比较解释第五式成立。
          replace_regex(
              '设定/世界观/金手指.md',
              r'## 六、终局闭环\n.*?\n---\n\n## 七、升级与代价写作原则',
              '''## 六、终局闭环\n\n镜辞最终有效MEM上限仍为999，壳王终局关系归并规模在作者后台同样记作999。\n\n但这两个数字不再承担“谁比谁大”的战斗结算。\n\n999对镜辞的真正意义是：\n\n> **一个主体能够主动完成的有效铭记、关系再暴露与现实承接抵达极限。**\n\n它同时暴露镜辞最后一个人物错误：即使他已经帮助那么多人重新拿回被压平的关系，他仍然下意识想成为“负责保存所有人的中心”。\n\n终局“+1”正式锁定由**姜霁**承担。\n\n这个“1”不是第1000点MEM，不把EX从0加回1，也不增加任何战斗参数。它表示：\n\n> **当镜辞自己的常规姓名与身份指向几乎彻底崩解时，仍有另一个生命能够通过两人长期互相改变后留下的真实关系，反向准确指向镜辞本人。**\n\n关系方向固定为：\n\n```text\n999：镜辞 → 其他人\n+1：姜霁 → 镜辞\n```\n\n因此作者后台保留“999+1”这个符号，但它表示的是**单向铭记闭合成双向关系网络**，不是 `999+1=1000，1000>999` 的破上限公式。\n\n正文必须先让读者看见具体行动：当系统已经显示源裂缝区域没有己方人员、姓名和显性记忆也无法稳定指向镜辞时，姜霁根据七卷共同生活形成的行为基线判断“镜辞一定还在最后一个没有撤离的人身边”，于是逆向回去找他。\n\n真正完成闭环的是：\n\n> **镜辞曾让姜霁变得不同，姜霁也真实改变过镜辞；当系统不再知道镜辞是谁时，这段双向关系仍能产生现实选择。**\n\n同时必须分开两层终局：\n- **世界层**：白塔认证、关系归并、现实身份同步、群体记忆/裂缝同步四条链被多方分别切断，临江市才摆脱“唯一指向”；\n- **镜辞个人层**：999+1证明他不是关系网络之外的中央保存者，而是网络中的一个节点，他同样会被别人认识、改变和找回。\n\n第五式因此获得的不是“多1点能量”，而是在四链被拆、真实关系重新具有发言空间后，完成镜辞本人双向关系闭环的条件。\n\n---\n\n## 七、升级与代价写作原则'''
          )

          # 6) 镜辞：把个人终局从数值比较改成双向关系。
          replace_regex(
              '设定/角色/镜辞.md',
              r'## 八、终局：不是击败一个数值，而是把人生重新分开\n\n镜辞自身MEM上限为999。.*?\n\n### 记忆归还做了什么',
              '''## 八、终局：不是击败一个数值，而是把人生重新分开\n\n镜辞自身MEM上限仍为999。\n\n这表示作者后台对他主动完成“有效铭记、关系再暴露与现实承接”的上限记录，不表示他把999个人的存在装进身体，也不代表999点战力。\n\n当壳王的身份归并规模同样达到后台999时，真正的问题不是“镜辞还差第1000个数值”。\n\n而是镜辞终于必须承认：\n\n> **只靠‘我记得别人’，无论做到多少，他仍然把自己放在关系网络的中心。**\n\n终局“+1”正式锁定为姜霁，但它不进入MEM。\n\n当全世界都快失去对“镜辞”这个名字的正确指向时，姜霁仍根据七卷共同生活形成的行为基线与彼此真实造成的改变，做出一个只有真正认识镜辞才会做出的选择，并反向找到他。\n\n作者后台继续把这称为：\n\n> **999+1。**\n\n其中999是“镜辞→他人”的单向铭记极限，+1是“姜霁→镜辞”的反向指向。它不是 `MEM+1`、`EX+1`，也不是 `1000>999` 的战斗判定。\n\n它先表现为关系行动：系统说镜辞已经撤离，姜霁却知道他一定会留下检查最后一个尚未撤出的人；她不是靠爱情雷达，而是靠多年互相改变后形成的真实认识逆向回去寻找他。\n\n这一刻完成的不是“镜辞数值超过壳王”，而是：\n\n> **镜辞终于接受，自己也值得被别人认识；存在不是由一个中心保存所有人，而是很多生命彼此改变后互相指向。**\n\n### 记忆归还做了什么'''
          )

          # 7) 总纲：保留姜霁锁定，但把后台公式改为符号结构。
          replace_exact(
              '大纲/大纲.md',
              '''- **镜辞MEM=999**：作者后台表示他已完成999次有效铭记/关系再暴露与承接，最多只能与壳王规模999的归并结构持平。这里不是“恢复999个人到原样”。\n- **关键“1”正式锁定为姜霁**：当镜辞EX逼近0、所有数据库和常规关系网络都无法稳定指出“镜辞还在源裂缝内部”时，姜霁根据七卷共同调查与生活形成的关系基线判断：镜辞一定会留下检查最后一个没有撤离的人。她在没有系统证据的情况下反向进入危险区寻找镜辞。这个行动不是女主特权，而是七卷关系因果的兑现。\n- **后台终局关系**：可概括为 `999（我有效铭记过你们） + 1（姜霁仍能通过真实关系认识我） = 1000 > 999`。**正文禁止显示MEM 999→1000、系统判定或数值弹窗，必须先写姜霁的具体行动。**''',
              '''- **镜辞MEM=999**：作者后台表示他已抵达一个主体能够主动完成“有效铭记/关系再暴露与承接”的极限。这里不是“恢复999个人到原样”，也不是999点终局战力。\n- **关键“1”正式锁定为姜霁**：当镜辞EX逼近0、所有数据库和常规关系网络都无法稳定指出“镜辞还在源裂缝内部”时，姜霁根据七卷共同调查与生活形成的关系基线判断：镜辞一定会留下检查最后一个没有撤离的人。她在没有系统证据的情况下反向进入危险区寻找镜辞。这个行动不是女主特权，而是七卷双向关系因果的兑现。\n- **后台终局关系**：保留“999+1”作为主题符号。999表示“镜辞→他人”的单向铭记极限，+1表示“姜霁→镜辞”的反向真实指向；**+1不进入MEM、不增加EX或战斗参数，也不使用 `1000>999` 直接判定壳王失败。** 世界层胜利仍由四条链被不同势力切断，第五式与姜霁的行动分别完成关系再暴露和镜辞个人的双向闭环。'''
          )

          # 8) 第八卷：把999+1明确为个人关系闭环，不承担城市胜负。
          replace_exact(
              '大纲/卷纲_第八卷.md',
              '''这就是终局后台的：\n\n> **999 + 1。**\n\n镜辞完成的是：\n\n> 我曾帮助你们重新拿回彼此辨认的权利。\n\n姜霁完成的是：\n\n> **即使中心系统已经无法告诉我你是谁，我和你之间真实发生过的关系仍然能指向你。**''',
              '''这就是终局后台保留的主题符号：\n\n> **999 + 1。**\n\n它不是“1000比999大”的胜负公式。999代表镜辞主动铭记/承接他人关系的单向极限，+1代表姜霁从另一个生命的方向反过来准确指向镜辞；这个1不计入MEM，也不增加EX或任何战斗参数。\n\n镜辞完成的是：\n\n> 我曾帮助你们重新拿回彼此辨认的权利。\n\n姜霁完成的是：\n\n> **即使中心系统已经无法告诉我你是谁，我和你之间真实发生过的关系仍然能指向你。**\n\n这一步完成的是镜辞个人的双向关系闭环。城市层面的“唯一指向”失败仍由前面四条链被不同的人和组织分别切断，不能把全城胜负压到姜霁一个“+1”上。'''
          )

          # 最后扫描显眼的旧算术写法；允许“999+1”本身存在，但禁止继续留1000>999胜负句。
          bad = []
          for p in ROOT.rglob('*.md'):
              text = p.read_text(encoding='utf-8')
              for token in ('1000 > 999', '1000>999', 'MEM 999→1000'):
                  if token in text:
                      bad.append((str(p), token))
          if bad:
              raise SystemExit('stale arithmetic terminal wording remains: ' + repr(bad))
          PY

      - name: Commit normalized rules and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-999plus1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: 统一999+1为双向关系终局机制'
          git push origin HEAD:master
